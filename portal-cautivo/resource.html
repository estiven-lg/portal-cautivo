<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>{{RESOURCE_TITLE}} | Portal-Lab</title>
    <link rel="stylesheet" href="{{PORTAL_URL}}styles.css">
</head>
<body class="resource-page">
    <header class="site-header">
        <a class="brand" href="{{PORTAL_URL}}" aria-label="Portal-Lab, inicio">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span>Portal-Lab</span>
        </a>
        <span class="network-name">Recurso interno</span>
    </header>

    <main class="resource-main">
        <article class="resource-detail">
            <p class="eyebrow">Demostración local</p>
            <h1>{{RESOURCE_TITLE}}</h1>
            <p class="resource-lead">{{RESOURCE_SUMMARY}}</p>
            <div class="simulation-note">
                <strong>Entorno simulado</strong>
                <p>{{RESOURCE_DETAIL}}</p>
            </div>
            <a class="button button-dark" href="{{PORTAL_URL}}">Volver al acceso</a>
        </article>
    </main>
</body>
</html>
